services:
  web:
    image: code-base-nextjs:latest
    container_name: code-base-nextjs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
